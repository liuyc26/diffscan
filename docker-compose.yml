services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diffscan
      POSTGRES_PASSWORD: diffscan
      POSTGRES_DB: diffscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://diffscan:diffscan@db:5432/diffscan
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      # Mount host repos so the scanner can read local paths
      - /:/host:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
